name: API Test Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/test/java/com/automation/apiTests/**'
  push:
    branches:
      - main
    paths:
      - 'src/test/java/com/automation/apiTests/**'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Dependencies
        run: mvn dependency:resolve

      - name: Build Project
        run: mvn clean compile -DskipTests

      - name: Run API Tests from api.xml
        run: mvn test -Papi -Dtestng.suite=src/test/resources/api.xml -Dmaven.test.failure.ignore=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/surefire-reports/
          retention-days: 30
