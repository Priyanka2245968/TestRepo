name: Build Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Display Maven version
        run: mvn --version

      - name: Compile project
        run: mvn clean compile -DskipTests

      - name: Run tests
        run: mvn test -Dheadless=true -Dbrowser=chromium
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/allure-results/
            target/surefire-reports/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results
        continue-on-error: true

      - name: Comment PR with test summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let testSummary = '## Build Pipeline Results\n\n';
            
            const surefireDir = 'target/surefire-reports';
            if (fs.existsSync(surefireDir)) {
              const files = fs.readdirSync(surefireDir).filter(f => f.endsWith('.xml'));
              if (files.length > 0) {
                testSummary += '✅ Test reports generated\n';
                testSummary += `- Found ${files.length} test result file(s)\n`;
              }
            }
            
            testSummary += '\n**Build Status:** ✅ Complete\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: testSummary
            });
        continue-on-error: true
