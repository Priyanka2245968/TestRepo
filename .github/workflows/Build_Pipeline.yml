name: Build Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/test/java/com/automation/tests/**'
  push:
    branches:
      - main
    paths:
      - 'src/test/java/com/automation/tests/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Dependencies
        run: mvn dependency:resolve

      - name: Build Project
        run: mvn clean compile -DskipTests

      - name: Run Tests from testng.xml
        run: mvn test -Dheadless=true -Dbrowser=chromium -Dtestng.suite=src/test/resources/testng.xml -Dmaven.test.failure.ignore=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 30
