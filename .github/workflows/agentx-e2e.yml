name: AgentX E2E Generated Tests

# Auto-generated by the One Touch E2E conductor. Runs ONLY the tests it
# generated for this branch — never the repo's pre-existing sample suite.
on:
  push:
    branches:
      - 'e2e/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Run generated E2E tests
        env:
          BASE_URL: ''
          API_URL: ''
        run: mvn -B -ntp test -Dtest='AgentXGeneratedRunnerTest,ViewArticleOnWikipediaApiTest' -DfailIfNoTests=false
